[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sundewsh"
version = "0.3.1"
description = "An open-source honeypot designed to detect and study autonomous AI agent attacks"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Sundew Contributors" },
]
keywords = ["honeypot", "security", "ai-agents", "deception", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.143.0,<1.0.0",
    "uvicorn[standard]>=0.54.0,<1.0.0",
    "pydantic>=2.14.0,<3.0.0",
    "pydantic-settings>=2.15.0,<3.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "click>=8.5.0,<9.0.0",
    "httpx>=0.28.1,<1.0.0",
    "rich>=15.0.0,<16.0.0",
    "mcp>=2.3.0,<3.0.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.13.0,<2.0.0"]
openai = ["openai>=3.29.0,<4.0.0"]
bedrock = ["boto3>=1.43.0,<2.0.0"]
all = ["anthropic>=1.13.0,<2.0.0", "openai>=3.29.0,<4.0.0", "boto3>=1.43.0,<2.0.0"]
dev = [
    "pytest>=9.1.0,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "ruff>=0.17.0,<1.0.0",
    "mypy>=2.4.0,<3.0.0",
    "httpx>=0.28.1,<1.0.0",
    "pip-audit>=2.10.0,<3.0.0",
    "bandit>=1.9.0,<2.0.0",
]

[project.scripts]
sundew = "sundew.cli:main"

[project.urls]
Homepage = "https://sundew.sh"
Documentation = "https://docs.sundew.sh"
Repository = "https://github.com/sundew-sh/sundew"
Issues = "https://github.com/sundew-sh/sundew/issues"
Changelog = "https://github.com/sundew-sh/sundew/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/sundew"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]

[tool.ruff.lint.isort]
known-first-party = ["sundew", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B104", "B105", "B311"]  # B101: assert ok, B104: honeypot binds all interfaces, B105: fake canary tokens, B311: non-crypto random
